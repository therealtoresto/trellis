[package]
name = "trellis"
version = "0.3.0"
description = "A database client for SQLite, PostgreSQL and MySQL."
edition = "2021"
license = "MIT"
repository = "https://github.com/therealtoresto/trellis"
authors = ["Taras Bondaruk"]
publish = false

[lib]
name = "trellis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async = { version = "0.37", features = ["native-tls-tls"] }
# The macOS Keychain; on Linux the Secret Service (GNOME Keyring, KWallet).
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }

[profile.release]
lto = "thin"
strip = true
