<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b8dff"/>
      <stop offset="0.58" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1020" flood-opacity="0.35"/>
    </filter>
    <filter id="slat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1040" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame"><rect x="282" y="282" width="460" height="460" rx="64"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
    <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>
  <!-- A trellis: slats crossing on the diagonal inside a frame. The slats running one way sit over the others. -->
  <g filter="url(#slat)">
    <g clip-path="url(#frame)" stroke="#fff" stroke-width="30" stroke-linecap="butt">
      <g opacity="0.62">
        <path d="M282 412 412 282M282 542 542 282M282 672 672 282M352 742 742 352M482 742 742 482M612 742 742 612"/>
      </g>
      <path d="M412 742 282 612M542 742 282 482M672 742 282 352M742 672 352 282M742 542 482 282M742 412 612 282"/>
    </g>
    <rect x="282" y="282" width="460" height="460" rx="64" fill="none" stroke="#fff" stroke-width="32"/>
  </g>
</svg>
