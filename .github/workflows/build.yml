# Builds Trellis for Ubuntu (.deb, .AppImage) and macOS (.app). Every push to main keeps the files as workflow
# artifacts; a tag such as v0.3.0 also puts them on a draft GitHub release, to publish by hand.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Ubuntu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev pkg-config build-essential xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: ./node_modules/.bin/tauri build --bundles deb appimage

      - name: Driver tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      # Opens the welcome window, the example database and a 20,000-row result on a virtual screen.
      - name: Smoke test
        run: |
          mkdir -p smoke
          TRELLIS_SELFTEST="$PWD/smoke" TRELLIS_SELFTEST_ONLY=grid TRELLIS_USERDATA="$(mktemp -d)" \
            timeout 180 xvfb-run -a src-tauri/target/release/trellis || true
          cat smoke/log.txt
          grep -q '^workspace opened on Example' smoke/log.txt
          grep -q '^large result: {"ok":true' smoke/log.txt
          grep -q '^done' smoke/log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trellis-ubuntu
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: ./node_modules/.bin/tauri build --bundles app

      - name: Zip the app
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent Trellis.app "$GITHUB_WORKSPACE/Trellis-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: trellis-macos
          path: Trellis-macos-arm64.zip

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: Trellis-macos-arm64.zip
