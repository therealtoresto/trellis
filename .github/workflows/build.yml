# Builds Trellis for Ubuntu (.deb, .AppImage) and macOS (.app) when a release tag is pushed (npm run release), and
# publishes the files as that GitHub release once both builds pass. Run it by hand from the Actions tab to get the
# files as workflow artifacts without a release.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the patch number is the commit count
      # The version lives in tauri.conf.json; a release tag must name the same one.
      - id: v
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $v in tauri.conf.json"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux:
    name: Ubuntu
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev pkg-config build-essential xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build ${{ env.VERSION }}
        run: ./node_modules/.bin/tauri build --bundles deb appimage

      - name: Driver tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      # Opens the welcome window, the example database and a 20,000-row result on a virtual screen.
      - name: Smoke test
        run: |
          mkdir -p smoke
          TRELLIS_SELFTEST="$PWD/smoke" TRELLIS_SELFTEST_ONLY=grid TRELLIS_USERDATA="$(mktemp -d)" \
            timeout 180 xvfb-run -a src-tauri/target/release/trellis || true
          cat smoke/log.txt
          grep -q "^welcome shows the build: \[\"Version $VERSION " smoke/log.txt
          grep -q '^workspace opened on Example' smoke/log.txt
          grep -q '^large result: {"ok":true' smoke/log.txt
          grep -q '^done' smoke/log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trellis-ubuntu
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build ${{ env.VERSION }}
        run: ./node_modules/.bin/tauri build --bundles app

      - name: Zip the app
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent Trellis.app "$GITHUB_WORKSPACE/Trellis_${VERSION}_macos_arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: trellis-macos
          path: Trellis_*_macos_arm64.zip

  release:
    name: Tag and release
    needs: [version, linux, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Trellis ${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/*.zip
