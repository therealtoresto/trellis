# Builds Trellis for Ubuntu (.deb, .AppImage) and macOS (.app) when a release tag is pushed (npm run release), and
# publishes the files as that GitHub release once both builds pass, with latest.json for the in-app updater. Run it by
# hand from the Actions tab to get the files as workflow artifacts without a release.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY signs the update files (the app holds the public key in tauri.conf.json);
# APT_GPG_KEY signs the apt repository published with each release.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Builds here also make the signed files the in-app updater downloads.
  UPDATER: '{"bundle":{"createUpdaterArtifacts":true}}'
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # The version lives in tauri.conf.json; a release tag must name the same one.
      - id: v
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $v in tauri.conf.json"; exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing (see README, Releasing)"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ -z "$APT_GPG_KEY" ]; then
            echo "::error::The APT_GPG_KEY secret is missing (see README, Releasing)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}

  linux:
    name: Ubuntu
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev pkg-config build-essential xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build ${{ env.VERSION }}
        run: ./node_modules/.bin/tauri build --bundles deb appimage --config "$UPDATER"

      # The updater installs a .deb too; sign it when the bundler did not.
      - name: Sign the .deb
        run: for f in src-tauri/target/release/bundle/deb/*.deb; do [ -f "$f.sig" ] || ./node_modules/.bin/tauri signer sign "$f"; done

      - name: Driver tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      # Opens the welcome window, the example database and a 20,000-row result on a virtual screen.
      - name: Smoke test
        run: |
          mkdir -p smoke
          TRELLIS_SELFTEST="$PWD/smoke" TRELLIS_SELFTEST_ONLY=grid TRELLIS_USERDATA="$(mktemp -d)" \
            timeout 180 xvfb-run -a src-tauri/target/release/trellis || true
          cat smoke/log.txt
          grep -q "^welcome shows the build: \[\"Version $VERSION " smoke/log.txt
          grep -q '^workspace opened on Example' smoke/log.txt
          grep -q '^large result: {"ok":true' smoke/log.txt
          grep -q '^json and arrays: {.*"ok":true}$' smoke/log.txt
          grep -q '^done' smoke/log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trellis-ubuntu
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build ${{ env.VERSION }}
        run: ./node_modules/.bin/tauri build --bundles app --config "$UPDATER"

      # The zip is for people (and Homebrew) and keeps one name across releases, so
      # releases/latest/download/Trellis_macos_arm64.zip is always the newest; the .tar.gz is for the updater.
      - name: Package the app
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent Trellis.app "$GITHUB_WORKSPACE/Trellis_macos_arm64.zip"
          cp Trellis.app.tar.gz "$GITHUB_WORKSPACE/Trellis_macos_arm64.app.tar.gz"
          cp Trellis.app.tar.gz.sig "$GITHUB_WORKSPACE/Trellis_macos_arm64.app.tar.gz.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: trellis-macos
          path: Trellis_macos_arm64.*

  release:
    name: Tag and release
    needs: [version, linux, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # What the in-app updater reads: the version, the commits since the last release and a signed file per platform.
      - name: Update manifest
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --pretty='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" | grep -v '\[RELEASE\]' | sed -E 's/^- \[[A-Z]+\] - /- /' > notes.txt || true
          node -e '
            const fs = require("fs"), path = require("path");
            const walk = d => fs.readdirSync(d, { withFileTypes: true }).flatMap(e => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
            const files = walk("dist"), base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}/`;
            const entry = re => {
              const f = files.find(x => re.test(x));
              if (!f || !fs.existsSync(f + ".sig")) throw new Error(`no signed file for ${re}`);
              return { url: base + path.basename(f), signature: fs.readFileSync(f + ".sig", "utf8").trim() };
            };
            const mac = entry(/macos_arm64\.app\.tar\.gz$/), appimage = entry(/\.AppImage$/), deb = entry(/\.deb$/);
            fs.writeFileSync("dist/latest.json", JSON.stringify({
              version: process.env.VERSION,
              notes: fs.readFileSync("notes.txt", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: { "darwin-aarch64": mac, "darwin-aarch64-app": mac, "linux-x86_64": appimage, "linux-x86_64-appimage": appimage, "linux-x86_64-deb": deb },
            }, null, 2));
          '
          cat dist/latest.json

      # A flat apt repository among the release files, so releases/latest/download is always the newest one:
      # Packages lists the .deb, Release has their checksums, signed as InRelease and Release.gpg.
      - name: apt repository
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils >/dev/null
          mkdir -p apt && cp $(find dist -name '*.deb') apt/
          cd apt
          dpkg-scanpackages --multiversion . /dev/null > Packages
          gzip -9kf Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=Trellis -o APT::FTPArchive::Release::Label=Trellis \
            -o APT::FTPArchive::Release::Architectures=amd64 release . > Release
          export GNUPGHOME=$(mktemp -d)
          echo "$APT_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase '' --clearsign -o InRelease Release
          gpg --batch --yes --pinentry-mode loopback --passphrase '' -abs -o Release.gpg Release
          gpg --export > trellis.gpg
          rm ./*.deb
          cat Packages Release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Trellis ${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/Trellis_macos_arm64.zip
            dist/Trellis_macos_arm64.app.tar.gz
            dist/latest.json
            apt/Packages
            apt/Packages.gz
            apt/Release
            apt/InRelease
            apt/Release.gpg
            apt/trellis.gpg

  # Installs the release on a clean Ubuntu the way the README says, from the published files.
  apt-install:
    name: apt install
    needs: [version, release]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 20 # releases/latest takes a moment to point at the new release
          bash scripts/install-linux.sh
          dpkg -s trellis | grep -q "^Version: $VERSION$"
          which trellis
